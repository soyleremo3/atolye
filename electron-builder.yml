appId: com.soyleremo3.atolye
productName: Atolye
copyright: Copyright © 2026 soyleremo3
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - package.json
  - node_modules/@lydell/**/*
asarUnpack:
  - node_modules/@lydell/**/*
asar: true
# Yalniz Turkce ve Ingilizce Chromium dil dosyalari (kalan 53 dil ~48 MB yer kaplar)
electronLanguages:
  - tr
  - en-US
npmRebuild: false
win:
  target: dir
  icon: build/icon.ico
